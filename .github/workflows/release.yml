# Builds the desktop app for Windows, macOS and Linux and attaches the downloads to a GitHub
# Release whenever a version tag (v1.2.3) is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run emulators
      - run: npm test

  # One draft release for the three builds to upload into (if each created its own, they'd race
  # and make duplicates). It's published at the end, once every build is there, so the app's
  # updater never sees a half-finished release.
  draft:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "Phosphor ${TAG#v}" \
              --notes "Download the installer for your computer below. Phosphor updates itself from here on Windows and Linux (AppImage); on a Mac, download the new version and install it over the old one."

  desktop:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis zip --x64
          - os: macos-latest
            args: --mac dmg zip --x64 --arm64
          - os: ubuntu-latest
            args: --linux AppImage deb tar.gz --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run emulators
      # Desktop emulators (Dolphin, Flycast...) for this runner's OS; a Mac is needed for .dmg files.
      - run: npm run native
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
