# Builds the desktop app for Windows, macOS and Linux and attaches the downloads to a GitHub
# Release whenever a version tag (v1.2.3) is pushed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run emulators
      - run: npm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis zip --x64
          - os: macos-latest
            args: --mac dmg zip --x64 --arm64
          - os: ubuntu-latest
            args: --linux AppImage deb tar.gz --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run emulators
      # Desktop emulators (Dolphin, Flycast...) for this runner's OS; a Mac is needed for .dmg files.
      - run: npm run native
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
